name: Release

# 推送 v* 标签 → 构建并在 GitHub Release 上发布 Windows 安装包；
# 手动触发（workflow_dispatch）→ 仅构建，产物可在 Actions 页面下载。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅在 tag 推送时创建 Release；手动触发时留空，只构建
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'SVCode ${{ github.ref_name }}'
          releaseBody: 'Windows 安装包见下方 Assets（.exe 为 NSIS 安装程序，.msi 为 MSI 安装包）。'
          releaseDraft: false
          prerelease: false
          args: '--target x86_64-pc-windows-msvc'

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: svcode-windows-x64
          path: ${{ steps.tauri.outputs.artifactPaths }}
          if-no-files-found: error
